[config]
schemaVersion = "0.0.1"

[package]
namespace = "FoldingSolid"
name = "FacilityMeltdownFork"
versionNumber = "2.7.501"
description = "A fork of FacilityMeltdown by loafc. Now including bug fixes and updates for Lethal Company v81."
websiteUrl = "https://github.com/FoldingSolid/FacilityMeltdownFork"
containsNsfwContent = false
[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"
TeamXiaolan-DawnLib = "0.9.27"

[build]
icon = "./Thunderstore/icon.png"
readme = "./Thunderstore/README.md"
outdir = "./build"

[[build.copy]]
source = "./FacilityMeltdown/bin/Release/netstandard2.1/FacilityMeltdown.dll"
target = "./plugins/FacilityMeltdown/FacilityMeltdown.dll"

[[build.copy]]
source = "./Assets/facilitymeltdown"
target = "./plugins/FacilityMeltdown/facilitymeltdown"

[[build.copy]]
source = "./Thunderstore/CHANGELOG.md"
target = "./CHANGELOG.md"

[[build.copy]]
source = "./FacilityMeltdown/Lang/en.json"
target = "./plugins/FacilityMeltdown/lang/en.json"

[[build.copy]]
source = "./FacilityMeltdown/Lang/es.json"
target = "./plugins/FacilityMeltdown/lang/es.json"

[[build.copy]]
source = "./FacilityMeltdown/Lang/kr.json"
target = "./plugins/FacilityMeltdown/lang/kr.json"

[[build.copy]]
source = "./FacilityMeltdown/Lang/ru.json"
target = "./plugins/FacilityMeltdown/lang/ru.json"

[[build.copy]]
source = "./FacilityMeltdown/Lang/zh.json"
target = "./plugins/FacilityMeltdown/lang/zh.json"

[[build.copy]]
source = "./FacilityMeltdown/sound_pack.json"
target = "./plugins/FacilityMeltdown/sound_pack.json"

[[build.copy]]
source = "./FacilityMeltdown/soundapi_mappings.json"
target = "./plugins/FacilityMeltdown/soundapi_mappings.json"

[publish]
repository = "https://thunderstore.io"
communities = [ "lethal-company", ]
[publish.categories]
lethal-company = [ "mods", "hazards", "equipment", ]


